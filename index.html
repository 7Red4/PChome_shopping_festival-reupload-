<body>
  <script>
    // 桌機寬度時改用手機框 iframe 顯示，讓 app 拿到真正的手機 viewport
    window.__PHONE_FRAME__ = window.self === window.top && window.innerWidth > 600;
    if (window.__PHONE_FRAME__) {
      document.documentElement.style.cssText = 'height:100%;background:#0b0b1a;';
      document.body.style.cssText = 'margin:0;height:100%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#2a2160,#0b0b1a 70%);';
      var phone = document.createElement('div');
      phone.style.cssText = 'width:390px;height:min(844px,calc(100vh - 48px));border:12px solid #111;border-radius:44px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.6);background:#000;';
      var frame = document.createElement('iframe');
      frame.src = window.location.href;
      frame.title = 'V1111P 幣勝遊戲場';
      frame.allow = 'autoplay; fullscreen';
      frame.style.cssText = 'width:100%;height:100%;border:0;display:block;';
      phone.appendChild(frame);
      document.body.appendChild(phone);
    }
  </script>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
